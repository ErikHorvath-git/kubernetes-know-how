apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-app
  namespace: exam-horvath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-app
  template:
    metadata:
      labels:
        app: exam-app
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exam-pvc
        - name: cfg
          configMap:
            name: app-config
            items:
              - key: SAMPLE_CSV_1
                path: sample1.csv
              - key: SAMPLE_CSV_2
                path: sample2.csv

      initContainers:
        - name: init-data
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data/input /data/output
              if [ -z "$(ls -A /data/input 2>/dev/null)" ]; then
                cp /cfg/sample1.csv /data/input/sample1.csv
                cp /cfg/sample2.csv /data/input/sample2.csv
              fi
              chown -R 33:33 /data
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cfg
              mountPath: /cfg

      containers:
        - name: exam-app
          image: gitdockeracc/exam-app:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: data
              mountPath: /var/www/html/data
