apiVersion: v1
kind: Service
metadata:
  name: exam-svc
  namespace: exam-test1
spec:
  selector:
    app: exam-app
  type: NodePort
  ports:
    # ─── PORTY — čo znamená čo ─────────────────────────────────────────────
    # port       = vnútorný port SAMOTNEJ Service v klastri (iný pod ju volá
    #              ako "exam-svc:<port>"). Voliš ľubovoľne.
    # targetPort = port v PODE kam Service posiela traffic.
    #              MUSÍ sa zhodovať s containerPort v deployment.yaml.
    # nodePort   = port na NODE-e (brána zvonku klastra).
    #              POVINNE v rozsahu 30000–32767. Mimo rozsah K8s nedovolí.
    #
    # Príklad: výstup z klastra port 70  ──►  localhost:3001
    #   - port 70 NIE JE platný nodePort, použi ho ako "port" (vnútorný)
    #   - mapovanie urobí port-forward, nie nodePort:
    #       kubectl port-forward -n exam-test1 svc/exam-svc 3001:70
    #     → localhost:3001  ─►  svc:70 (port)  ─►  pod:80 (targetPort)
    #   - ak chceš zvonku cez NodeIP, nodePort musí byť napr. 30070
    # ───────────────────────────────────────────────────────────────────────
    - port: 80         # port Service vnútri klastra (DNS: exam-svc:80)
      targetPort: 80   # = containerPort v deployment.yaml (kde appka počúva)
      nodePort: 30080  # 30000–32767, dostupné zvonku ako <NodeIP>:30080
