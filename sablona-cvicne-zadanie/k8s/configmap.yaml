apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: exam-horvath
data:
  # Spoločné pre všetky varianty:
  APP_NAME: "Exam HorvathVK"

  # ─── Variant A (upload) ───
  MAX_UPLOAD_MB: "10"

  # ─── Variant B (logger) ───
  LOG_LEVEL: "INFO"

  # ─── Variant C (template + InitContainer) ───
  WELCOME_TEXT: |
    Vitajte v aplikácii!
    Tento súbor pripravil InitContainer pri štarte podu.
    Namespace: exam-horvath
    Aplikácia: PHP cvičná úloha

  # ─── Variant D (CMS) ───
  SITE_TITLE: "Môj Markdown Blog"
