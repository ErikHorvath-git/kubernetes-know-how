apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-fe
  namespace: exam-horvath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-fe                  # ← service-fe ho hľadá podľa toho
  template:
    metadata:
      labels:
        app: exam-fe                # INÝ label ako BE/DB!
    spec:
      volumes:
        # nginx config ako súbor (Pattern 2: ConfigMap volume)
        - name: nginx-conf
          configMap:
            name: fe-config
            items:
              - key: default.conf
                path: default.conf

      containers:
        - name: exam-fe
          image: exam-fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf       # mountuje sa len 1 súbor
