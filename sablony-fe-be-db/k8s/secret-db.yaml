# Heslá patria do Secret, NIE do ConfigMap.
# stringData = plain text (k8s si to sám base64-zakóduje pri uložení).
# V realite: nikdy necommituj reálne heslá — použi SealedSecrets / ExternalSecrets / vault.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: exam-meno
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpass123"
  MYSQL_PASSWORD: "apppass123"      # ← toto isté heslo číta BE (pripojenie ako appuser)
