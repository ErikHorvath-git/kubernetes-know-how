apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-fe
  namespace: exam-horvath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-fe              # ← service-fe ho hľadá podľa toho
  template:
    metadata:
      labels:
        app: exam-fe            # ← INÝ label ako BE!
    spec:
      volumes:
        # Pattern 2: ConfigMap ako súbor (mountuje sa nginx config)
        - name: nginx-conf
          configMap:
            name: fe-config
            items:
              - key: default.conf            # kľúč v configmap-fe.yaml
                path: default.conf           # názov súboru v mount-e

      containers:
        - name: exam-fe
          image: exam-fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf          # mountuje sa len 1 SÚBOR, nie celý priečinok
